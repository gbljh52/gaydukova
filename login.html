<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="login.css">
</head>
<body class="d-flex justify-content-center align-items-center vh100">
  <form name="loginForm" id="loginForm" novalidate>
    <div class="container d-flex flex-column align-items-center bg-secondary-subtle rounded-4">
      <div class="btn-group mt-4 mx-5" role="group">
        <button type="button" class="btn btn-outline-secondary active">Вход</button>
        <button type="button" class="btn btn-outline-secondary">Регистрация</button>
      </div>
      <div class="mt-5 mb-2 w-75">
        <label for="email" class="form-label">e-mail/логин</label>
        <input type="text" class="form-control" id="email" name="email" placeholder="name@example.com">
      </div>
      <div class="mb-3 w-75">
        <label for="password" class="form-label">пароль</label>
        <input type="password" id="password" name="password" class="form-control">
      </div>
      <div class="w-75 d-grid mt-2">
        <button type="submit" class="btn btn-primary" type="button">Войти</button>
      </div>
      <a href="resetPassword" class="mt-3">Забыли пароль ?</a>
    </div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="site.js"></script>

</body>
</html>
